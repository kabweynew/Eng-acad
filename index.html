<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Academy</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2A4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Academy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#FAF6EE;
    --paper-raised:#FFFFFF;
    --ink:#1B2A4A;
    --ink-soft:#4A5773;
    --line:#E4DCC9;
    --teal:#2F7A6B;
    --teal-dark:#1F5A4E;
    --amber:#E8A33D;
    --amber-soft:#FBEBD1;
    --rose:#C2564B;
    --radius:10px;
    --serif:'Lora', Georgia, serif;
    --sans:'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Layout ---------- */
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
  @media (max-width:760px){ .app{grid-template-columns:1fr;} .sidebar{position:sticky;top:0;z-index:5;} }

  .sidebar{background:var(--ink);color:#EFEAE0;}
  .sidebar-bar{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);}
  .brand{font-family:var(--serif);font-weight:700;font-size:1.3rem;}
  .brand span{color:var(--amber);}
  .menu-toggle{display:none;background:none;border:1px solid rgba(255,255,255,.28);color:#EFEAE0;border-radius:6px;padding:6px 11px;font-size:1.05rem;line-height:1;}
  .nav-list{list-style:none;margin:0;padding:8px 0;}
  .nav-group{padding:16px 20px 6px;font-size:.72rem;color:#8891A8;}
  .nav-item{padding:11px 20px;display:flex;align-items:center;gap:10px;font-size:.93rem;color:#C9CFDD;border-left:3px solid transparent;cursor:pointer;}
  .nav-item:hover{color:#fff;background:rgba(255,255,255,.05);}
  .nav-item.active{color:#fff;border-left-color:var(--amber);background:rgba(255,255,255,.07);font-weight:600;}
  .nav-icon{width:20px;text-align:center;opacity:.85;}

  /* Mobile: sidebar collapses to a slim bar; nav list opens as a drawer and
     auto-closes on navigation, so a selected section/lesson gets the full screen. */
  @media (max-width:760px){
    .menu-toggle{display:inline-flex;}
    .sidebar-bar{padding:14px 18px;}
    .nav-list{display:none;padding:0;}
    .nav-list.open{display:block;max-height:70vh;overflow-y:auto;}
  }

  .main{padding:32px 40px 80px;max-width:980px;}
  @media (max-width:760px){ .main{padding:20px 18px 60px;} }

  .crumb{font-size:.82rem;color:var(--ink-soft);margin-bottom:6px;}
  h1{font-family:var(--serif);font-size:1.9rem;margin:0 0 4px;}
  h2{font-family:var(--serif);font-size:1.35rem;margin:0 0 10px;}
  .subtitle{color:var(--ink-soft);margin-bottom:28px;}

  /* ---------- Home dashboard ---------- */
  .section-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:34px;}
  .section-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;}
  .section-card:hover{border-color:var(--teal);}
  .section-card .icon{font-size:1.4rem;}
  .section-card .name{font-weight:600;margin-top:8px;}
  .section-card .desc{font-size:.8rem;color:var(--ink-soft);margin-top:2px;}

  .continue-row{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
  .continue-item{display:flex;align-items:center;gap:14px;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .continue-item .cname{flex:1;font-weight:600;}
  .continue-item .cstatus{font-size:.85rem;color:var(--ink-soft);}
  .bar{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
  .bar-fill{height:100%;background:var(--teal);}
  .done-badge{color:var(--teal-dark);font-weight:600;font-size:.85rem;}

  /* ---------- Module list ---------- */
  .module-list{display:flex;flex-direction:column;gap:10px;}
  .module-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);}
  .module-row.locked{opacity:.55;}
  .module-num{font-family:var(--serif);font-weight:700;color:var(--teal-dark);width:26px;}
  .module-title{font-weight:600;flex:1;}
  .module-sub{font-size:.8rem;color:var(--ink-soft);}
  .module-row .go{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:.85rem;font-weight:600;}
  .module-row .go:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}
  .placeholder-note{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--radius);padding:14px 16px;font-size:.88rem;color:#6B4B18;margin-top:6px;}

  /* ---------- Lesson ---------- */
  .lesson-step{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;}
  .lesson-step h3{font-family:var(--serif);font-size:1.1rem;margin:0 0 12px;}
  .step-index{display:inline-block;font-size:.72rem;letter-spacing:.03em;color:var(--teal-dark);background:var(--amber-soft);padding:3px 9px;border-radius:20px;margin-bottom:10px;}
  .sound-display{font-family:var(--serif);font-size:3.2rem;color:var(--teal-dark);text-align:center;margin:6px 0 14px;}
  .word-row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;}
  .word-chip{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:1.05rem;}
  .speak-btn{background:none;border:1px solid var(--teal);color:var(--teal-dark);border-radius:50%;width:28px;height:28px;font-size:.85rem;}
  .speak-btn:hover{background:var(--teal);color:#fff;}
  .blend-box{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--serif);font-size:1.6rem;margin:16px 0;}
  .blend-box .plus{color:var(--ink-soft);font-size:1.1rem;}
  .blend-box .arrow{color:var(--amber);}
  .practice-input{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:1rem;width:180px;font-family:var(--sans);}
  .practice-input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .check-btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:600;margin-left:8px;}
  .check-btn:hover{background:var(--teal-dark);}
  .feedback{margin-top:10px;font-size:.9rem;font-weight:600;min-height:20px;}
  .feedback.correct{color:var(--teal-dark);}
  .feedback.wrong{color:var(--rose);}
  .sentence-line{font-family:var(--serif);font-size:1.15rem;margin:8px 0;}
  .passage{background:var(--paper);border-left:3px solid var(--amber);padding:14px 18px;font-family:var(--serif);font-size:1.08rem;line-height:1.7;margin:10px 0;}
  .quiz-q{margin-bottom:16px;}
  .quiz-q p{font-weight:600;margin-bottom:8px;}
  .quiz-opts{display:flex;flex-direction:column;gap:6px;}
  .quiz-opt{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 14px;}
  .quiz-opt:hover{border-color:var(--teal);}
  .quiz-opt.selected-correct{background:var(--amber-soft);border-color:var(--teal);}
  .quiz-opt.selected-wrong{background:#FBE4E1;border-color:var(--rose);}
  .step-nav{display:flex;justify-content:space-between;margin-top:6px;}
  .nav-btn{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:11px 22px;font-weight:600;}
  .nav-btn:hover{background:var(--teal-dark);}
  .nav-btn.secondary{background:none;border:1px solid var(--line);color:var(--ink-soft);}
  .result-box{text-align:center;padding:30px 20px;}
  .result-score{font-family:var(--serif);font-size:2.6rem;color:var(--teal-dark);}
  .save-note{font-size:.78rem;color:var(--ink-soft);text-align:center;margin-top:10px;}

  /* ---------- General English additions ---------- */
  .pic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin:12px 0;}
  .pic-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 6px 10px;text-align:center;}
  .pic-card .pic{height:46px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;line-height:1;}
  .pic-card .swatch{width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}
  .pic-card .pic-word{font-weight:600;margin:6px 0 6px;font-size:.95rem;}
  .info-list{margin:8px 0;padding-left:20px;} .info-list li{margin:6px 0;}
  .fill-row{margin:12px 0;font-size:1.05rem;line-height:2.2;}
  .fill-row input{width:110px;border:none;border-bottom:2px solid var(--line);background:var(--paper);padding:4px 8px;font-size:1rem;font-family:var(--sans);text-align:center;}
  .fill-row input.ok{border-bottom-color:var(--teal);background:var(--amber-soft);} .fill-row input.bad{border-bottom-color:var(--rose);background:#FBE4E1;}
  .write-box{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--sans);font-size:1rem;}
  .write-box:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .ex-box{background:var(--paper);border-radius:8px;padding:10px 14px;margin:10px 0;font-family:var(--serif);}
  .bad-ex{color:var(--rose);} .good-ex{color:var(--teal-dark);}

  .install-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--radius);padding:14px 18px;margin:0 0 20px;}
  .install-banner span{color:var(--ink-soft);font-size:.9rem;}
  .share-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
  .share-btn{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 10px;font-weight:600;font-size:.95rem;}
  .share-btn:hover{border-color:var(--teal);}
  .qr-box{width:240px;max-width:100%;margin:10px auto 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .qr-box svg{display:block;width:100%;height:auto;}
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar-bar">
      <div class="brand">English <span>Academy</span></div>
      <button class="menu-toggle" id="menuToggle" onclick="toggleNav()" aria-label="Toggle menu">☰</button>
    </div>
    <ul class="nav-list" id="navList"></ul>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

const FIREBASE_ENABLED = false; // set true after filling in firebaseConfig
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

let db = null;
if (FIREBASE_ENABLED) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.enablePersistence().catch(()=>{});
}

const LEARNER_ID = 'demo-learner'; // replace with real auth uid when you add login

const Progress = {
  data: JSON.parse(localStorage.getItem('ea-progress') || '{}'),

  get(moduleId){ return this.data[moduleId] || { status:'not-started', score:null }; },

  async set(moduleId, entry){
    this.data[moduleId] = entry;
    localStorage.setItem('ea-progress', JSON.stringify(this.data));
    if (FIREBASE_ENABLED && db) {
      try {
        await db.collection('learners').doc(LEARNER_ID)
          .collection('progress').doc(moduleId).set(entry, { merge:true });
      } catch(e){ console.warn('Firestore save failed, kept locally:', e); }
    }
  },

  async loadFromFirestore(){
    if (!FIREBASE_ENABLED || !db) return;
    try {
      const snap = await db.collection('learners').doc(LEARNER_ID).collection('progress').get();
      snap.forEach(doc => { this.data[doc.id] = doc.data(); });
      localStorage.setItem('ea-progress', JSON.stringify(this.data));
    } catch(e){ console.warn('Firestore load failed:', e); }
  }
};

/* =========================================================
   VIEWS
   ========================================================= */
function speak(text){
  const path = AUDIO_MAP[text];
  if (path) {
    const audio = new Audio(path);
    let fellBack = false;
    const fallback = () => { if (!fellBack) { fellBack = true; speakTTS(text); } };
    audio.addEventListener('error', fallback);
    audio.play().catch(fallback);
    return;
  }
  speakTTS(text);
}

let cachedVoices = [];
function loadVoices(){ cachedVoices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function pickBestVoice(){
  if (!cachedVoices.length) cachedVoices = speechSynthesis.getVoices();
  const en = cachedVoices.filter(v => /^en[-_]/i.test(v.lang));
  return en.find(v => /Google US English/i.test(v.name))
      || en.find(v => /Natural|Neural|Online/i.test(v.name))
      || en.find(v => /Samantha|Ava|Allison|Daniel|Karen|Google UK English/i.test(v.name))
      || en.find(v => v.lang.replace('_','-') === 'en-US' && !v.localService)
      || en.find(v => v.lang.replace('_','-') === 'en-US')
      || en[0]
      || cachedVoices[0];
}

function speakTTS(text){
  if (!('speechSynthesis' in window)) return;
  // Voices load late on some phones: wait briefly for them once, then speak.
  if (!cachedVoices.length) {
    cachedVoices = speechSynthesis.getVoices();
    if (!cachedVoices.length) { setTimeout(() => { cachedVoices = speechSynthesis.getVoices(); doSpeak(text); }, 250); return; }
  }
  doSpeak(text);
}

function doSpeak(text){
  const u = new SpeechSynthesisUtterance(text);
  const voice = pickBestVoice();
  if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = 'en-US'; }
  // Single words are clearer when slower; sentences stay natural.
  u.rate = text.trim().split(/\s+/).length === 1 ? 0.75 : 0.88;
  speechSynthesis.cancel();
  setTimeout(() => speechSynthesis.speak(u), 60); // avoids dropped audio after cancel() on iOS/Chrome
}

    <div class="section-grid">${sectionCards}</div>
  `;
}

function findModuleTitle(id){
  for (const arr of Object.values(MODULES)) {
    const m = arr.find(x => x.id === id);
    if (m) return m.title;
  }
  return id;
}

function renderSection(sectionId){
  const section = SECTIONS.find(s => s.id === sectionId);
  const modules = MODULES[sectionId] || [];
  const rows = modules.map((m,i) => {
    const p = Progress.get(m.id);
    const statusLabel = p.status==='completed' ? 'Completed ✓'
      : p.status==='in-progress' ? `${p.score||0}% — in progress`
      : 'Not started';
    return `
    <div class="module-row ${m.built ? '' : 'locked'}">
      <div class="module-num">${i+1}</div>
      <div style="flex:1;">
        <div class="module-title">${m.title}</div>
        <div class="module-sub">${m.sub} · ${statusLabel}</div>
      </div>
      ${m.built
        ? `<button class="go" onclick='go({view:"lesson", moduleId:"${m.id}"})'>${p.status==='not-started' ? 'Start' : 'Continue'}</button>`
        : `<button class="go" disabled>Coming soon</button>`}
    </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="crumb">Home / ${section.name}</div>
    <h1>${section.icon} ${section.name}</h1>
    <p class="subtitle">${section.desc}</p>
    <div class="module-list">${rows}</div>
    ${modules.some(m=>!m.built) ? `<div class="placeholder-note" style="margin-top:16px;">This section uses the same navigation, progress tracking, and lesson pattern as the rest of the app. Tell me which module to build out next and I'll follow the same structure.</div>` : ''}
  `;
}

const TBL = '<svg width="46" height="40" viewBox="0 0 46 40"><rect x="3" y="8" width="40" height="6" rx="2" fill="#A9712F"/><rect x="7" y="14" width="4" height="22" fill="#8A5A24"/><rect x="35" y="14" width="4" height="22" fill="#8A5A24"/></svg>';
function sp(t){ return '<button class="speak-btn" data-t="'+t.replace(/"/g,'&quot;')+'" onclick="speak(this.dataset.t)">🔊</button>'; }
let _salt = 0;
function QQ(list){
  return list.map((a,i) => {
    const wrong = a.slice(2);
    const pos = (i + _salt++) % (wrong.length + 1);
    const opts = wrong.slice(); opts.splice(pos, 0, a[1]);
    return { q:a[0], opts, correct:a[1] };
  });
}
function buildGE(d){
  const steps = []; let n = 0; const L = t => (++n) + ' · ' + t;
  steps.push({ render:'info', label:L('Learning objectives'), tag:'Objectives', heading:'By the end of this lesson you can…',

    intro:v.i || 'Listen and repeat. Say each word aloud, then tap 🔊 to check.',
    items:v.w.map(x => ({ word:x[0], pic:x[1]==='TABLE' ? TBL : x[1] })) }));
  (d.extra||[]).forEach(e => steps.push({ render:'info', label:L(e.l), tag:e.t, heading:e.h, html:e.html }));
  steps.push({ render:'info', label:L('Meaning and examples'), tag:'Pattern', heading:d.pat.h,
    html:'<div class="ex-box">'+d.pat.ex.map(x=>x+' '+sp(x)).join('<br>')+'</div><p>'+d.pat.note+'</p>' });
  steps.push({ render:'quiz', label:L('Vocabulary activity'), questions:QQ(d.q1) });
  steps.push({ render:'passage', label:L('Reading text'), text:d.text });
  steps.push({ render:'quiz', label:L('Reading comprehension'), questions:QQ(d.q2) });

    items:d.fill.map(f => ({ before:f[0], after:f[1], answer:f[2] })) });
  steps.push({ render:'info', label:L('Speaking practice'), tag:'Speaking', heading:'Say it aloud',
    html:d.speak.map(s=>'<div class="ex-box">'+s+'</div>').join('')+'<p>Practise with a partner or the AI Teacher.</p>' });
  steps.push({ render:'write', label:L('Writing + real-life task'), heading:d.write.h || 'Write about it', prompt:d.write.p, example:d.write.e });
  steps.push({ render:'info', label:L('Common mistakes'), tag:'Careful!', heading:'Common mistakes and exceptions',
    html:d.mist.map(m=>'<div class="ex-box"><span class="bad-ex">❌ '+m[0]+'</span><br><span class="good-ex">✅ '+m[1]+'</span> — '+m[2]+'</div>').join('') });
  steps.push({ render:'quiz', label:L('Review and mini-assessment'), questions:QQ(d.rev) });

}

/* ===== Install & Share ===== */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (route.view==='share' || route.view==='home') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; });

function appUrl(){
  try { const s = localStorage.getItem('ea_app_url'); if (s) return s; } catch(e){}
  return /^https?:/.test(location.href) ? location.href.split('#')[0].split('?')[0] : '';
}
function shareMsg(){ return 'Learn English with English Academy — free lessons for reading, vocabulary and real-life English. Open the link and tap Install:'; }
function qrSvg(url){
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  return qr.createSvgTag({ cellSize:6, margin:4, scalable:true }).replace('>', '><rect width="100%" height="100%" fill="#fff"/>');
}
function updateQR(){
  const url = (document.getElementById('shareUrl')||{}).value.trim();
  try { localStorage.setItem('ea_app_url', url); } catch(e){}
  const box = document.getElementById('qrBox'); if (!box) return;
  box.innerHTML = /^https?:\/\//.test(url) ? qrSvg(url) : '<p style="color:var(--rose);font-weight:600;">Paste the full https:// link of your app above to create the QR code.</p>';
}
function currentShareUrl(){ const el = document.getElementById('shareUrl'); return el ? el.value.trim() : appUrl(); }
function shareVia(kind){
  const url = currentShareUrl(); if (!/^https?:\/\//.test(url)) { alert('First paste the full https:// link of the app.'); return; }
  const m = shareMsg(), t = encodeURIComponent(m + ' ' + url);
  if (kind==='whatsapp') window.open('https://wa.me/?text=' + t, '_blank');
  else if (kind==='email') location.href = 'mailto:?subject=' + encodeURIComponent('English Academy — install the app') + '&body=' + t;
  else if (kind==='sms') location.href = 'sms:?&body=' + t;
  else if (kind==='telegram') window.open('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(m), '_blank');
  else if (kind==='native') { if (navigator.share) navigator.share({ title:'English Academy', text:m, url }).catch(()=>{}); else shareVia('copy'); }
  else if (kind==='copy') {
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => alert('Link copied.')).catch(() => prompt('Copy this link:', url));
    else prompt('Copy this link:', url);
  }
}
function installApp(){
  if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; render(); }); }
  else alert('Android (Chrome): tap ⋮ then "Install app" or "Add to Home screen".\n\niPhone (Safari): tap the Share button, then "Add to Home Screen".');
}
function downloadQR(){
  const svg = document.querySelector('#qrBox svg'); if (!svg) return;
  const data = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 600;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,600,600); g.drawImage(img,0,0,600,600);
    const a = document.createElement('a'); a.download = 'english-academy-qr.png'; a.href = c.toDataURL('image/png'); a.click();
  };
  img.src = data;
}
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone; }
function installBanner(){
  if (isStandalone()) return '';
  return `<div class="install-banner"><div><strong>📲 Install English Academy</strong><br><span>Use it like a normal app, even with a weak connection.</span></div>
    <button class="nav-btn" onclick="installApp()">Install</button></div>`;
}
function renderShare(){
  const url = appUrl();
  const btn = (k, label) => `<button class="share-btn" onclick="shareVia('${k}')">${label}</button>`;
  document.getElementById('main').innerHTML = `
    <div class="crumb">Home / Install &amp; Share</div>
    <h1>📲 Install &amp; Share</h1>
    <p class="subtitle">Put English Academy on a phone, then send the link or let people scan the QR code.</p>
    <div class="lesson-step">
      <h3>1 · Install on this device</h3>
      ${isStandalone() ? '<p>✅ The app is already installed on this device.</p>' : `<button class="nav-btn" onclick="installApp()">Install the app</button>
      <p style="color:var(--ink-soft);font-size:.9rem;margin-top:10px;"><strong>Android (Chrome):</strong> ⋮ → Install app.<br><strong>iPhone (Safari):</strong> Share → Add to Home Screen.</p>`}
    </div>
    <div class="lesson-step">
      <h3>2 · The app link</h3>
      <input class="practice-input" style="width:100%;" id="shareUrl" value="${url}" placeholder="https://your-app-address.com/" oninput="updateQR()" autocomplete="off">
      <p style="color:var(--ink-soft);font-size:.85rem;margin-top:8px;">This is filled in automatically when you open the app from its web address. If it is empty, paste the link where you published the app.</p>
    </div>
    <div class="lesson-step">
      <h3>3 · Send the link</h3>
      <div class="share-grid">
        ${btn('whatsapp','🟢 WhatsApp')}${btn('email','✉️ Email')}${btn('sms','💬 SMS')}${btn('telegram','✈️ Telegram')}${btn('native','📤 Share…')}${btn('copy','🔗 Copy link')}
      </div>
    </div>
    <div class="lesson-step" style="text-align:center;">
      <h3>4 · Scan to open &amp; install</h3>
      <div id="qrBox" class="qr-box"></div>
      <p style="color:var(--ink-soft);font-size:.9rem;">Point the phone camera at the code. It opens the app link, where the learner taps <strong>Install</strong>.</p>
      <button class="nav-btn secondary" onclick="downloadQR()">⬇️ Download QR image</button>
    </div>`;
  updateQR();
}

function renderLesson(moduleId){
  if (!LESSONS[moduleId]) {
    document.getElementById('main').innerHTML = `<p>This module isn't built yet.</p>`;
    return;
  }
  lessonState = { moduleId, stepIndex: lessonState.moduleId===moduleId ? lessonState.stepIndex : 0, quizAnswers:{}, quizScore:0 };
  renderLessonStep();
}

function stepNav(canBack, canNext, nextLabel){
  return `<div class="step-nav">
    ${canBack ? `<button class="nav-btn secondary" onclick="lessonPrev()">Back</button>` : `<span></span>`}
    ${canNext ? `<button class="nav-btn" onclick="lessonNext()">${nextLabel||'Continue'}</button>` : ''}
  </div>`;
}

function renderLessonStep(){
  const lesson = LESSONS[lessonState.moduleId];
  const step = lesson.steps[lessonState.stepIndex];
  const isFirst = lessonState.stepIndex === 0;
  const isLast = lessonState.stepIndex === lesson.steps.length - 1;
  let body = '';

  if (step.render === 'sound-intro') {
    body = `
      <div class="step-index">${lesson.title} · ${step.ipa}</div>
      <h3>Today's sound</h3>
      <div class="sound-display">${step.sound} <span style="color:var(--ink-soft);font-size:1.6rem;">${step.ipa}</span></div>
      <p style="text-align:center;color:var(--ink-soft);">Like the sound in: <strong>${step.examples}</strong>.</p>
      <div style="text-align:center;margin-top:10px;">
        <button class="speak-btn" style="width:auto;border-radius:8px;padding:8px 16px;" onclick="speak('${step.playText}')">🔊 Hear it</button>
      </div>
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'listen-words') {
    const chips = step.words.map(w => `
      <div class="word-chip">${w}
        <button class="speak-btn" onclick="speak('${w}')">🔊</button>
      </div>`).join('');
    body = `
      <div class="step-index">Vocabulary</div>
      <h3>Listen and repeat</h3>
      <p>${step.intro}</p>
      <div class="word-row">${chips}</div>
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'blend') {
    const partsHTML = step.parts.map((p,i) => i < step.parts.length-1
      ? `<span>${p}</span><span class="plus">+</span>` : `<span>${p}</span>`).join('');
    body = `
      <div class="step-index">Blending practice</div>
      <h3>Build the word</h3>
      <p>Blend the sounds together, then type the word they make.</p>
      <div class="blend-box">${partsHTML}<span class="arrow">→</span><span>?</span></div>
      <div style="text-align:center;">
        <input class="practice-input" id="blendAnswer" placeholder="type the word" autocomplete="off">
        <button class="check-btn" onclick="checkBlend('${step.answer}')">Check</button>
      </div>
      <div class="feedback" id="blendFeedback"></div>
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'recognize') {
    body = `
      <div class="step-index">Word recognition</div>
      <h3>Which word matches the sound?</h3>
      <button class="speak-btn" style="width:auto;border-radius:8px;padding:8px 16px;margin-bottom:12px;" onclick="speak('${step.playText}')">🔊 Play word</button>
      <div class="quiz-opts" id="recognizeOpts">
        ${step.options.map(o => `<button class="quiz-opt" onclick="checkRecognize(this,'${o}','${step.answer}')">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="recognizeFeedback"></div>
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'phrases') {
    body = `
      <div class="step-index">Phrases</div>
      <h3>Read aloud</h3>
      ${step.lines.map(l => `<div class="sentence-line">${l}</div>`).join('')}
      <p style="color:var(--ink-soft);font-size:.9rem;">Say each phrase out loud before continuing.</p>
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'sentences') {
    body = `
      <div class="step-index">Sentences</div>
      <h3>Read the sentences</h3>
      ${step.lines.map(l => `<div class="sentence-line">${l}</div>`).join('')}
      <div style="text-align:center;margin-top:8px;">
        <button class="speak-btn" style="width:auto;border-radius:8px;padding:8px 16px;" onclick="speak('${step.playText}')">🔊 Hear it</button>
      </div>
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'passage') {
    const safeSpeak = step.text.replace(/\n/g, ' ').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    body = `
      <div class="step-index">Reading passage</div>
      <h3>Read the short passage</h3>
      <div class="passage">${step.text.replace(/\n/g, '<br>')}</div>
      <div style="text-align:center;">
        <button class="speak-btn" style="width:auto;border-radius:8px;padding:8px 16px;" onclick="speak('${safeSpeak}')">🔊 Listen to passage</button>
      </div>
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'quiz') {
    body = `
      <div class="step-index">Mini-test</div>
      <h3>Comprehension check</h3>
      ${step.questions.map((qq,qi) => `
        <div class="quiz-q">
          <p>${qi+1}. ${qq.q}</p>
          <div class="quiz-opts">
            ${qq.opts.map((o,oi) => `<button class="quiz-opt" onclick="answerQuiz(${qi},this,${oi})">${o}</button>`).join('')}
          </div>
        </div>`).join('')}
      ${stepNav(!isFirst, true, 'See result')}`;
  }

  else if (step.render === 'pic-vocab') {
    body = `
      <div class="step-index">Picture vocabulary</div>
      <h3>${step.heading}</h3>
      <p>${step.intro}</p>
      <div class="pic-grid">${step.items.map(it => `
        <div class="pic-card"><div class="pic">${it.pic}</div>
          <div class="pic-word">${it.word}</div>
          ${sp(it.word)}</div>`).join('')}</div>
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'info') {
    body = `
      <div class="step-index">${step.tag}</div>
      <h3>${step.heading}</h3>
      ${step.html}
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'fill') {
    body = `
      <div class="step-index">Practice</div>
      <h3>Complete the sentences</h3>
      <p>${step.intro}</p>
      ${step.items.map((it,i) => `<div class="fill-row">${it.before} <input id="fill_${i}" autocomplete="off" autocapitalize="off"> ${it.after}</div>`).join('')}
      <button class="check-btn" style="margin-left:0;" onclick="checkFill()">Check answers</button>
      <div class="feedback" id="fillFeedback"></div>
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'write') {
    body = `
      <div class="step-index">Writing · Real-life task</div>
      <h3>${step.heading}</h3>
      <p>${step.prompt}</p>
      <div class="ex-box">Example: ${step.example}</div>
      <textarea class="write-box" id="writeBox" placeholder="Write your sentences here…"></textarea>
      <div style="margin:10px 0;"><button class="speak-btn" style="width:auto;border-radius:8px;padding:8px 16px;" onclick="speakWriting()">🔊 Hear my sentences</button></div>
      <p style="color:var(--ink-soft);font-size:.9rem;">Read your sentences aloud, then continue.</p>
      ${stepNav(!isFirst, !isLast)}`;
  }

  else if (step.render === 'result') {
    const total = lesson.steps.filter(s => s.render==='quiz').reduce((n,s) => n + s.questions.length, 0);
    const scorePct = Math.round((lessonState.quizScore/total)*100);
    Progress.set(lessonState.moduleId, { status:'completed', score:scorePct });
    body = `
      <div class="result-box">
        <div class="step-index">Lesson complete</div>
        <h2>${lesson.title}</h2>
        <div class="result-score">${scorePct}%</div>
        <p style="color:var(--ink-soft);">${scorePct >= 80 ? step.message : 'Review the earlier steps before moving on.'}</p>
        <div class="step-nav" style="justify-content:center;gap:12px;">
          <button class="nav-btn secondary" onclick="go({view:'section', section:'${lesson.backSection}'})">Back to section</button>
          <button class="nav-btn" onclick="go({view:'home'})">Home</button>
        </div>
        <div class="save-note">${FIREBASE_ENABLED ? 'Saved to Firestore.' : 'Saved locally — turn on Firestore in the code to sync across devices.'}</div>
      </div>`;
  }

  document.getElementById('main').innerHTML = `
    <div class="crumb">Home / ${lesson.crumb}</div>
    <h1>${lesson.icon} ${lesson.title}</h1>
    <p class="subtitle">${step.label}</p>
    <div class="lesson-step">${body}</div>
  `;
}

function lessonNext(){
  const lesson = LESSONS[lessonState.moduleId];
  if (lessonState.stepIndex < lesson.steps.length - 1) {
    lessonState.stepIndex++;
    if (lesson.steps[lessonState.stepIndex].render !== 'result') {
      Progress.set(lessonState.moduleId, { status:'in-progress', score: Math.round((lessonState.stepIndex/(lesson.steps.length-1))*100) });
    }
    renderLessonStep();
  }
}
function lessonPrev(){
  if (lessonState.stepIndex > 0) { lessonState.stepIndex--; renderLessonStep(); }
}

function checkFill(){
  const step = LESSONS[lessonState.moduleId].steps[lessonState.stepIndex];
  let right = 0;
  step.items.forEach((it,i) => {
    const el = document.getElementById('fill_'+i);
    const ok = it.answer.split('|').includes(el.value.trim().toLowerCase().replace(/\s+/g,' '));
    el.className = ok ? 'ok' : 'bad';
    if (ok) right++;
  });
  const fb = document.getElementById('fillFeedback');
  fb.textContent = right === step.items.length ? 'All correct!' : `${right} of ${step.items.length} correct. Fix the red ones and check again.`;
  fb.className = 'feedback ' + (right === step.items.length ? 'correct' : 'wrong');
}
function speakWriting(){
  const t = document.getElementById('writeBox').value.trim();
  if (t) speak(t);
}

function checkBlend(answer){
  const val = document.getElementById('blendAnswer').value.trim().toLowerCase();
  const fb = document.getElementById('blendFeedback');
  if (val === answer) {
    fb.textContent = `Correct! That's "${answer}".`;
    fb.className = 'feedback correct';
  } else {
    fb.textContent = val ? 'Almost — sound out each part and try again.' : 'Type your answer first.';
    fb.className = 'feedback wrong';
  }
}

function checkRecognize(btn, chosen, correct){
  document.querySelectorAll('#recognizeOpts .quiz-opt').forEach(b => b.classList.remove('selected-correct','selected-wrong'));
  const fb = document.getElementById('recognizeFeedback');
  if (chosen === correct) {
    btn.classList.add('selected-correct');
    fb.textContent = 'Correct!';
    fb.className = 'feedback correct';
  } else {
    btn.classList.add('selected-wrong');
    fb.textContent = `Not quite. The word was "${correct}".`;
    fb.className = 'feedback wrong';
  }
}

function answerQuiz(qIndex, btn, oi){
  const _q = LESSONS[lessonState.moduleId].steps[lessonState.stepIndex].questions[qIndex];
  const chosen = _q.opts[oi], correct = _q.correct;
  const group = btn.parentElement;
  group.querySelectorAll('.quiz-opt').forEach(b => b.classList.remove('selected-correct','selected-wrong'));
  const qKey = lessonState.stepIndex + '-' + qIndex;
  const wasAnswered = lessonState.quizAnswers[qKey] !== undefined;
  btn.classList.add(chosen === correct ? 'selected-correct' : 'selected-wrong');
  if (!wasAnswered) {
    lessonState.quizAnswers[qKey] = chosen;
    if (chosen === correct) lessonState.quizScore++;
  }
}

/* =========================================================
   RENDER DISPATCH
   ========================================================= */
function render(){
  renderNav();
  if (route.view === 'home') renderHome();
  else if (route.view === 'section') renderSection(route.section);
  else if (route.view === 'lesson') renderLesson(route.moduleId);
  else if (route.view === 'share') renderShare();
}

Progress.loadFromFirestore().finally(render);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
<style>
  .ea-modal-back{position:fixed;inset:0;background:rgba(27,42,74,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .ea-modal-back.show{display:flex;}
  .ea-modal{background:#fff;border-radius:16px;max-width:380px;width:100%;padding:26px 24px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .ea-modal img{width:72px;height:72px;border-radius:16px;margin-bottom:10px;}
  .ea-modal h2{font-family:var(--serif);margin:0 0 8px;font-size:1.35rem;}
  .ea-modal p{color:var(--ink-soft);margin:0 0 16px;font-size:.95rem;}
  .ea-modal ol{text-align:left;color:var(--ink);font-size:.95rem;margin:0 0 16px;padding-left:22px;}
  .ea-modal .row{display:flex;gap:10px;justify-content:center;}
  .ea-ok{font-size:2.6rem;color:var(--teal);margin-bottom:4px;}
</style>
<div class="ea-modal-back" id="eaModalBack"><div class="ea-modal" id="eaModal"></div></div>
<script>
(function(){
  var KEY_DISMISS='ea_install_dismissed', KEY_DONE='ea_installed', KEY_WELCOME='ea_welcome_shown';
  var dp = null;
  function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){} return null; }
  function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
  function openModal(html){ document.getElementById('eaModal').innerHTML = html; document.getElementById('eaModalBack').classList.add('show'); }
  window.eaCloseModal = function(remember){ document.getElementById('eaModalBack').classList.remove('show'); if(remember) ls(KEY_DISMISS, String(Date.now())); };
  var ICON = '<img src="icon-192.png" alt="">';

  function installPrompt(){
    openModal(ICON+'<h2>Install English Academy</h2><p>Install the app on your phone. It opens like a normal app, with its own icon, full screen, and works with a weak connection.</p><div class="row"><button class="nav-btn secondary" onclick="eaCloseModal(true)">Not now</button><button class="nav-btn" onclick="eaDoInstall()">Install</button></div>');
  }
  function iosPrompt(){
    openModal(ICON+'<h2>Install English Academy</h2><p>On iPhone and iPad, install it from Safari:</p><ol><li>Tap the <strong>Share</strong> button ⬆️</li><li>Tap <strong>Add to Home Screen</strong></li><li>Tap <strong>Add</strong></li></ol><div class="row"><button class="nav-btn" onclick="eaCloseModal(true)">OK</button></div>');
  }
  function manualPrompt(){
    openModal(ICON+'<h2>Install English Academy</h2><p>Open this page in <strong>Chrome</strong> (Android) or <strong>Edge</strong>, then tap ⋮ → <strong>Install app</strong>. The Install button appears automatically when the app is opened from its web address (https).</p><div class="row"><button class="nav-btn" onclick="eaCloseModal(false)">OK</button></div>');
  }
  function installedMsg(){
    ls(KEY_DONE,'1');
    openModal('<div class="ea-ok">✅</div><h2>Application installed</h2><p>English Academy is now installed. Open it from your home screen or app list.</p><div class="row"><button class="nav-btn" onclick="eaCloseModal(false)">Great</button></div>');
  }

  window.eaDoInstall = function(){
    if (!dp) { eaCloseModal(false); return manualPrompt(); }
    eaCloseModal(false);
    dp.prompt();
    dp.userChoice.then(function(c){ if (c.outcome !== 'accepted') ls(KEY_DISMISS, String(Date.now())); dp = null; if (typeof render==='function') render(); });
  };
  // Used by the Install & Share page and the home banner
  window.installApp = function(){
    if (standalone()) return installedMsgAlready();
    if (dp) return installPrompt();
    if (isIOS()) return iosPrompt();
    manualPrompt();
  };
  function installedMsgAlready(){ openModal('<div class="ea-ok">✅</div><h2>Application installed</h2><p>You are already using the installed app.</p><div class="row"><button class="nav-btn" onclick="eaCloseModal(false)">OK</button></div>'); }

  function recentlyDismissed(){ var t = +ls(KEY_DISMISS) || 0; return Date.now() - t < 3*24*3600*1000; }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); dp = e; window.deferredInstall = e;
    if (typeof render==='function') render();
    if (!recentlyDismissed() && !standalone()) setTimeout(installPrompt, 1200);
  });
  window.addEventListener('appinstalled', function(){ dp = null; window.deferredInstall = null; installedMsg(); if (typeof render==='function') render(); });

  window.addEventListener('load', function(){
    if (standalone()) {
      // First launch of the installed app: confirm it
      if (!ls(KEY_WELCOME)) { ls(KEY_WELCOME,'1'); installedMsg(); }
    } else if (isIOS() && !recentlyDismissed()) {
      setTimeout(iosPrompt, 1500);
    }
  });
})();
</script>

</body>
